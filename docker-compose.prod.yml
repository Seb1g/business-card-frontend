services:
  business-card:
    build: .
    container_name: business-card
    restart: always
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.business-card.rule=Host(`${MY_DOMAIN}`)"
      - "traefik.http.routers.business-card.entrypoints=websecure"
      - "traefik.http.services.business-card.loadbalancer.server.port=80"
      - "traefik.http.routers.business-card.service=business-card"

networks:
  traefik-public:
    external: true