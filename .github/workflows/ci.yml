name: Build and Push with Kaniko

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted  # Сборка крутится на твоем железе!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Create Docker Auth Config
        run: |
          mkdir -p ~/.docker
          echo '{"auths": {"ghcr.io":{"auth":"'$(echo -n "${{ github.actor }}:${{ secrets.GHCR_TOKEN }}" | base64)'"}}}' > ~/.docker/config.json

      - name: Build and Push Image via Kaniko
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ~/.docker/config.json:/kaniko/.docker/config.json:ro \
            gcr.io/kaniko-project/executor:latest \
            --context=/workspace \
            --dockerfile=/workspace/Dockerfile \
            --destination=ghcr.io/${{ github.repository }}:latest \
            --destination=ghcr.io/${{ github.repository }}:${{ github.sha }} \
            --cache=true
